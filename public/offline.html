<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — ZeroSync</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0b12; color: #e7e7ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 20px; color: #9a9aa3; max-width: 320px; }
      button { background: #a3e635; color: #0b0b12; border: 0; border-radius: 10px;
        padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <img src="/icon-192.png" alt="ZeroSync" />
        <h1>You're offline</h1>
        <p>ZeroSync needs a connection to load this page. Cached pages still work — try again when you're back online.</p>
        <button onclick="location.reload()">Retry</button>
      </div>
    </div>
  </body>
</html>
