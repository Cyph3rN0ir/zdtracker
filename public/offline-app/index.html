<!doctype html>
<html lang="en" data-theme="zerodesk" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ZeroSync</title>
    <meta
      name="description"
      content="ZeroSync — business tracking, money management, and task assignment."
    />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ZeroSync" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    />

    <!-- Theme boot: apply saved theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var k = "zt.theme";
          var t = localStorage.getItem(k) || "zerodesk";
          var dark =
            ["dark", "midnight", "ember", "noir", "zerodesk", "infrared"].indexOf(t) !== -1;
          var r = document.documentElement;
          r.dataset.theme = t;
          if (dark) r.classList.add("dark");
        } catch (e) {
          document.documentElement.dataset.theme = "zerodesk";
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" crossorigin src="/offline-app/assets/main-CJzN1mHg.js"></script>
    <link rel="stylesheet" crossorigin href="/offline-app/assets/styles-CVSUTZDN.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
