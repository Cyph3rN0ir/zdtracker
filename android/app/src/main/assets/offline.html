<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZeroSync — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --border: #2a2a2a;
        --text: #f5f5f5;
        --muted: #6b7280;
        --accent: #e5e5e5;
        --icon-color: #3b3b3b;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top, 24px) 32px env(safe-area-inset-bottom, 32px);
        gap: 0;
      }

      .card {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: fadeUp 0.5s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon-wrap {
        width: 80px;
        height: 80px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      .icon-wrap svg {
        width: 36px;
        height: 36px;
        color: var(--muted);
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .wordmark {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        text-align: center;
        line-height: 1.25;
      }

      .description {
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
        max-width: 280px;
      }

      .divider {
        width: 40px;
        height: 1px;
        background: var(--border);
        border-radius: 1px;
      }

      .hint {
        font-size: 12px;
        color: var(--icon-color);
        text-align: center;
        letter-spacing: 0.01em;
      }

      .retry-btn {
        margin-top: 4px;
        padding: 12px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        -webkit-tap-highlight-color: transparent;
      }

      .retry-btn:active {
        background: #222;
        border-color: #444;
      }

      /* Animated signal dots at the bottom */
      .signal {
        display: flex;
        gap: 5px;
        align-items: flex-end;
        height: 20px;
      }

      .signal span {
        width: 4px;
        border-radius: 2px;
        background: var(--border);
        animation: signalBounce 1.6s ease-in-out infinite;
      }

      .signal span:nth-child(1) { height: 8px;  animation-delay: 0s; }
      .signal span:nth-child(2) { height: 13px; animation-delay: 0.15s; }
      .signal span:nth-child(3) { height: 18px; animation-delay: 0.3s; }
      .signal span:nth-child(4) { height: 13px; animation-delay: 0.45s; }
      .signal span:nth-child(5) { height: 8px;  animation-delay: 0.6s; }

      @keyframes signalBounce {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <!-- wifi-off icon -->
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="currentColor"/>
        </svg>
      </div>

      <span class="wordmark">ZeroSync</span>

      <h1 class="title">You're offline</h1>

      <p class="description">
        No internet connection detected. Connect to Wi-Fi or mobile data to continue.
      </p>

      <div class="signal">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="divider"></div>

      <button class="retry-btn" onclick="window.location.reload()">
        Try again
      </button>

      <p class="hint">ZeroSync needs a connection to your account</p>
    </div>
  </body>
</html>
